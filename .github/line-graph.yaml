name: Generate Animated Line Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/line-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: activity
          plugin_activity: yes
          plugin_activity_limit: 30
          plugin_activity_days: 30
          plugin_activity_visibility: all
          plugin_activity_graph: yes
          plugin_activity_graph_type: line
          plugin_activity_graph_animate: yes

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "update animated line graph" || echo "no changes"
          git push