name: Generate Animated Line Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate SVG
        run: |
          mkdir -p assets
          cat > assets/line-graph.svg <<'EOF'
          <svg width="800" height="200" viewBox="0 0 800 200"
            xmlns="http://www.w3.org/2000/svg">

            <polyline
              points="20,150 120,80 220,130 320,60 420,110 520,70 620,120 720,50"
              fill="none"
              stroke="#58a6ff"
              stroke-width="4"
              stroke-linecap="round"
              stroke-dasharray="1200"
              stroke-dashoffset="1200">
              <animate
                attributeName="stroke-dashoffset"
                from="1200"
                to="0"
                dur="2s"
                repeatCount="indefinite" />
            </polyline>

          </svg>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/line-graph.svg
          git commit -m "update animated line graph" || exit 0
          git push
