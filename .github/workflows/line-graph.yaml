name: Generate Animated Line Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/line-graph.svg

          base: activity
          plugin_activity: yes
          plugin_activity_limit: 30
          plugin_activity_days: 30

          config_timezone: Asia/Kolkata
