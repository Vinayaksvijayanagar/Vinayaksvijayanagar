<svg width="100%" height="200" viewBox="0 0 1000 200"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Neon Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#00ff99"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Static Base Line -->
  <path
    d="M50 140 
       L150 90 
       L250 130 
       L350 70 
       L450 110 
       L550 80 
       L650 120 
       L750 60 
       L850 100 
       L950 50"
    fill="none"
    stroke="#222"
    stroke-width="3"
  />

  <!-- Animated Line -->
  <path
    d="M50 140 
       L150 90 
       L250 130 
       L350 70 
       L450 110 
       L550 80 
       L650 120 
       L750 60 
       L850 100 
       L950 50"
    fill="none"
    stroke="url(#grad)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#glow)"
    stroke-dasharray="1200"
    stroke-dashoffset="1200">

    <animate
      attributeName="stroke-dashoffset"
      from="1200"
      to="0"
      dur="2.5s"
      repeatCount="indefinite"/>

  </path>

</svg>
